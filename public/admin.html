<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Sidhh Listener</title>
<style>
  :root{--dark:#314b4b;--bg:#f8f6f3;--text:#263f40;--muted:#6b7a7a}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
  .wrap{max-width:1000px;margin:auto;padding:40px 20px}
  .card{background:#fff;padding:30px;border-radius:18px;box-shadow:0 8px 30px rgba(38,63,64,.08);max-width:380px;margin:80px auto}
  input{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;box-sizing:border-box;font:inherit;margin:10px 0}
  button{background:var(--dark);color:#fff;border:0;padding:12px 20px;border-radius:10px;font-weight:800;cursor:pointer;width:100%}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-size:13px}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #eee;white-space:nowrap}
  th{background:#eef1f0;font-size:12px;text-transform:uppercase;color:var(--muted)}
  .status-paid{color:#2e7d32;font-weight:700}
  .status-pending{color:#b46b61;font-weight:700}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
  .err{color:#b3261e;font-size:13px;min-height:18px}
  .table-wrap{overflow-x:auto}
  #logout{background:transparent;color:var(--dark);border:1px solid var(--dark);width:auto;padding:8px 16px}
</style>
</head>
<body>

<div id="loginView" class="card">
  <h2 style="margin-top:0">Admin Login</h2>
  <input id="pw" type="password" placeholder="Admin password">
  <button onclick="login()">Log in</button>
  <p class="err" id="loginErr"></p>
</div>

<div id="panelView" class="wrap" style="display:none">
  <div class="topbar">
    <h2>Bookings</h2>
    <button id="logout" onclick="logout()">Log out</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Booking ID</th><th>Customer</th><th>Phone</th><th>Session</th><th>Date / Time</th><th>Amount</th><th>Payment</th></tr></thead>
      <tbody id="rows"><tr><td colspan="7">Loading…</td></tr></tbody>
    </table>
  </div>
</div>

<script>
const TOKEN_KEY = 'sl_admin_token';

async function login(){
  const pw = document.getElementById('pw').value;
  const errEl = document.getElementById('loginErr');
  errEl.textContent = '';
  const r = await fetch('/api/admin/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: pw }) });
  const j = await r.json();
  if(!j.ok){ errEl.textContent = j.error || 'Login failed.'; return; }
  sessionStorage.setItem(TOKEN_KEY, pw);
  showPanel();
}

function logout(){ sessionStorage.removeItem(TOKEN_KEY); location.reload(); }

async function showPanel(){
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('panelView').style.display = 'block';
  const token = sessionStorage.getItem(TOKEN_KEY);
  const r = await fetch('/api/bookings', { headers: { Authorization: 'Bearer ' + token } });
  if(!r.ok){ sessionStorage.removeItem(TOKEN_KEY); location.reload(); return; }
  const bookings = await r.json();
  const rows = document.getElementById('rows');
  if(!bookings.length){ rows.innerHTML = '<tr><td colspan="7">No bookings yet.</td></tr>'; return; }
  rows.innerHTML = bookings.map(b => `
    <tr>
      <td>${b.id}</td>
      <td>${b.name}</td>
      <td>${b.phone}</td>
      <td>${b.plan}</td>
      <td>${b.date} — ${b.time}</td>
      <td>₹${b.amount}</td>
      <td class="status-${b.status}">${b.status === 'paid' ? 'Paid' : 'Pending'}</td>
    </tr>`).join('');
}

if(sessionStorage.getItem(TOKEN_KEY)){ showPanel(); }
</script>
</body>
</html>
