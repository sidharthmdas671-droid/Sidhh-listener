<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment Failed — Sidhh Listener</title>
<style>
  :root{--dark:#314b4b;--bg:#f8f6f3;--text:#263f40;--muted:#6b7a7a}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}
  .card{background:#fff;max-width:420px;width:100%;padding:36px 30px;border-radius:22px;box-shadow:0 12px 40px rgba(38,63,64,.1);text-align:center}
  .x{font-size:56px;color:#b3261e}
  h1{font-size:22px;margin:10px 0 10px}
  p{color:var(--muted);font-size:14px}
  a.btn{display:inline-block;margin-top:20px;background:var(--dark);color:#fff;padding:12px 22px;border-radius:12px;text-decoration:none;font-weight:800}
</style>
</head>
<body>
<div class="card">
  <div class="x">✕</div>
  <h1>Payment Failed</h1>
  <p>Your payment could not be completed, and you have not been charged. Please try booking again.</p>
  <a class="btn" href="/#book">Try again</a>
</div>
</body>
</html>
